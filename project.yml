name: Ripple
options:
  bundleIdPrefix: app.ripple
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: WH9D3XTKPT
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RippleCore:
    path: Packages/RippleCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 13.1.1
targets:
  Ripple:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ['Resources', '**/GoogleService-Info.example.plist']
      - path: App/Resources
        buildPhase: resources
        excludes: ['GoogleService-Info.plist']
    preBuildScripts:
      - name: Bundle optional Firebase configuration
        path: tools/bundle_firebase.sh
        basedOnDependencyAnalysis: false
        inputFiles: ['$(SRCROOT)/App/Resources/GoogleService-Info.plist']
        outputFiles: ['$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist']
    dependencies:
      - package: RippleCore
        product: RippleEngine
      - package: RippleCore
        product: LearningModel
      - package: RippleCore
        product: ContentKit
      - package: RippleCore
        product: SyncKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAppCheck
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ripple
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        FirebaseAnalyticsCollectionEnabled: false
        FirebaseCrashlyticsCollectionEnabled: false
        FirebaseAutomaticScreenReportingEnabled: false
        RippleContentBaseURL: https://ripple-grammar-2026.web.app
        RipplePrivacyURL: https://app-support.anton-chepur.chatgpt.site/ripple/privacy/
        RippleSupportURL: https://app-support.anton-chepur.chatgpt.site/ripple/support/
    entitlements:
      path: App/Ripple.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.devicecheck.appattest-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ripple.grammar
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: App/Ripple.Release.entitlements
    scheme:
      testTargets: [RippleUITests, RippleAppTests]
      storeKitConfiguration: App/Resources/Ripple.storekit
  RippleAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/AppTests]
    dependencies:
      - target: Ripple
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RippleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
      - path: App/Resources/Ripple.storekit
        buildPhase: resources
    dependencies:
      - target: Ripple
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
