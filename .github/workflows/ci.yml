name: Verify Ripple
on: [push, pull_request]
permissions:
  contents: read
jobs:
  content-and-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/author_scenarios.py --check
      - run: python3 tools/author_content.py --check
      - run: python3 tools/ripplec.py --check
      - run: python3 -m unittest discover -s tools/tests -v
      - run: swift test --package-path Packages/RippleCore --enable-code-coverage
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
        working-directory: firebase
      - run: npm run test:rules
        working-directory: firebase
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Simulator tests
        run: xcodebuild -project Ripple.xcodeproj -scheme Ripple -destination 'platform=iOS Simulator,name=iPhone 16e,OS=26.1' -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
